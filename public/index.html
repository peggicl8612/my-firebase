<!-- public/index.html -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猜拳遊戲 + 聊天室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 登入區域 -->
        <div id="login-section">
            <!-- <h1>猜拳遊戲 + 聊天室</h1> -->
            <button id="anonymous-login">匿名登入</button>
            <div id="email-login">
                <input type="text" id="username" placeholder="暱稱" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="密碼" required>
                <button id="login-btn">登入</button>
                <button id="register-btn">註冊</button>
            </div>
        </div>

        <!-- 主遊戲區域 -->
        <div id="game-section" style="display: none;">
            <div id="user-info"></div>
            <button id="logout-btn">登出</button>
            
            <!-- 遊戲區域 -->
            <div id="game-area">
                <h2>猜拳遊戲</h2>
                <input type="text" id="room-id" placeholder="房間 ID">
                <button id="create-room">建立房間</button>
                <button id="join-room">加入房間</button>
                
                <div id="game-status"></div>
                <div id="choices">
                    <button class="choice-btn" data-choice="rock">✊ 石頭</button>
                    <button class="choice-btn" data-choice="paper">✋ 布</button>
                    <button class="choice-btn" data-choice="scissors">✌️ 剪刀</button>
                </div>
            </div>

            <!-- 聊天室區域 -->
            <div id="chat-area">
                <h2>聊天室</h2>
                <div id="messages"></div>
                <div id="message-input">
                    <input type="text" id="message-text" placeholder="輸入訊息...">
                    <button id="send-btn">發送</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../src/index.ts"></script>
</body>
</html>
